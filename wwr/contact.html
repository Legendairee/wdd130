<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Whitewater rafting is always available to serve you. Reaching out made easy">
    <meta name="author" content="Mathew Udowa">
    <title>Contact Us | Salmon River Experience</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="./images/z-therapidssplash.jpg" alt="Rafting logo" width="100">
        <div id="logo">Salmon River Experience</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="address">
            <h1>Salmon River Experience</h1>
            <address class="contact-info">
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </div>
        <div class="map-form">
            <div class="group map">
                <div class="group map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3270119.2954967287!2d-118.31548576505446!3d36.831077605155066!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1780689898895!5m2!1sen!2sng"
                      width="450" height="350" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            <form class="group form">
                <div class="form-item column1 change">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Natalie Nkoto">
                </div>
                <div class="form-item column1">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail"
                      placeholder="example@gmail.com">
                </div>
                <div class="radio">
                    <h2>Message Purpose</h2>
                    <div class="radio-options">
                        <div class="radio-group">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-group">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-group">
                            <input type="radio" id="website" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <div class="form-item column2">
                    <label for="feedback">Message</label>
                    <textarea id="feedback" name="feedback" rows="2"
                      placeholder="Type here"></textarea>
                </div>
                <div class="form-item column3">
                    <input type="checkbox" id="news" name="news">
                    <label for="news">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="profile">
            <h3>We Are Here to Serve You</h3>
            <figure>
                <img src="./images/alyibel.jpg" alt="alyibel Chief Engineer image">
                <figcaption>Chief Engineer</figcaption>
            </figure>
            <figure>
                <img src="./images/seidenperle.jpg" alt="Seidenperle Marketing Manager image">
                <figcaption>Marketing Manager</figcaption>
            </figure>
            <figure>
                <img src="./images/sergey.jpg" alt="Sergey Finance Manager image">
                <figcaption>Finance Manager</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy;2026 🌴 Salmon River Experience 🌴 Mathew Udowa</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="./images/icons8-facebook-96.png" alt="Facebook Icon">
            </a>
            <a href="https://x.com" target="_blank">
                <img src="./images/twitter.png" alt="X Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="./images/icons8-instagram-96.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
